<link
    rel="stylesheet"
    type="text/css"
    href="css/datatables.min.css"
>

<link
    rel="stylesheet"
    type="text/css"
    href="css/style.css"
>

<script
    type="text/javascript"
    src="js/datatables.min.js"
></script>

<main>
    <header class="page-header">
        <div>
            <h1>Gestion des réseaux</h1>
            <p>
                Ajouter les réseaux disponibles.
            </p>
        </div>
    </header>

    <section class="form-section">
        <h2 id="form_title_reseau">
            Ajouter un réseau
        </h2>

        <form
            id="form_reseau"
            method="post"
            action="route.php">
            <input
                type="hidden"
                name="page"
                value="save_reseau">

            <input
                type="hidden"
                id="id_reseau"
                name="id_reseau"
                value="">

            <div class="form-group">
                <label for="nom_blockchain">
                    Nom du réseau *
                </label>

                <input
                    type="text"
                    id="nom_blockchain"
                    name="nom_blockchain"
                    maxlength="50"
                    placeholder="Exemple : Polygon"
                    required>
            </div>

            <div class="form-actions">
               <button
                    type="button"
                    id="btn_ajouter_reseau"
                    class="btn btn-add"
                    onclick="ajoutReseauServeur()">
                    Ajouter
                </button>



                <button
                    type="button"
                    id="btn_modifier_reseau"
                    class="btn btn-edit hide"
                    onclick="majReseauServeur()">
                    Modifier
                </button>

                <button
                    type="button"
                    id="btn_annuler_reseau"
                    class="btn btn-cancel hide"
                    onclick="clearFormReseau()">
                    Annuler
                </button>

                <button
                    type="button"
                    class="btn btn-cancel"
                    onclick="window.location.href='gestion_crypto'">
                    Retour au portfolio
                </button>
            </div>
        </form>
    </section>

    <section class="portfolio-section">
        <div class="section-header">
            <h2>Réseaux existants</h2>
        </div>

        <table id="table_reseaux">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nom du réseau</th>
                    <th>Modifier</th>
                    <th>Supprimer</th>
                </tr>
            </thead>

            <tbody></tbody>
        </table>
    </section>
</main>

<div
    class="modalChanged"
    id="divModalSaving"
></div>

<script src="js/gestion_reseaux.js"></script>
