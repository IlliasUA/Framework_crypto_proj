<link
    rel="stylesheet"
    type="text/css"
    href="css/datatables.min.css"
>

<link
    rel="stylesheet"
    type="text/css"
    href="css/style.css"
>

<script
    type="text/javascript"
    src="js/datatables.min.js"
></script>

<main>
    <header class="page-header">
        <div>
            <h1>Gestion des stratégies</h1>
            <p>
                Ajouter et consulter les stratégies disponibles.
            </p>
        </div>
    </header>

    <section class="form-section">
        <h2 id="form_title_strategie">
            Ajouter une stratégie
        </h2>

        <form
            id="form_strategie"
            method="post"
            action="route.php"
        >
            <input
                type="hidden"
                name="page"
                value="save_strategie"
            >

            <input
                type="hidden"
                id="id_strategies"
                name="id_strategies"
                value=""
            >

            <div class="form-group">
                <label for="nom_strategies">
                    Nom de la stratégie *
                </label>

                <input
                    type="text"
                    id="nom_strategies"
                    name="nom_strategies"
                    maxlength="50"
                    placeholder="Exemple : Investissement progressif"
                    required
                >
            </div>

            <div class="form-actions">
                <button
                    type="button"
                    id="btn_ajouter_strategie"
                    class="btn btn-add"
                    onclick="ajoutStrategieServeur()"
                >
                    Ajouter
                </button>

                <button
                    type="button"
                    id="btn_modifier_strategie"
                    class="btn btn-edit hide"
                    onclick="majStrategieServeur()"
                >
                    Modifier
                </button>

                <button
                    type="button"
                    id="btn_annuler_strategie"
                    class="btn btn-cancel hide"
                    onclick="clearFormStrategie()"
                >
                    Annuler
                </button>

                <button
                    type="button"
                    class="btn btn-cancel"
                    onclick="window.location.href='gestion_crypto'"
                >
                    Retour au portfolio
                </button>
            </div>
        </form>
    </section>

    <section class="portfolio-section">
        <div class="section-header">
            <h2>Stratégies existantes</h2>
        </div>

        <table id="table_strategies">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nom de la stratégie</th>
                    <th>Modifier</th>
                    <th>Supprimer</th>
                </tr>
            </thead>

            <tbody></tbody>
        </table>
    </section>
</main>

<div
    class="modalChanged"
    id="divModalSaving"
></div>

<script src="js/gestion_strategies.js"></script>
