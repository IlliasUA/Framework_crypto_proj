<link
    rel="stylesheet"
    type="text/css"
    href="css/datatables.min.css"
>

<link
    rel="stylesheet"
    type="text/css"
    href="css/style.css"
>

<script
    type="text/javascript"
    src="js/datatables.min.js"
></script>

<main>
    <header class="page-header">
        <div>
            <h1>Gestion des notifications</h1>
            <p>
                Ajouter et consulter les types de notification.
            </p>
        </div>
    </header>

    <section class="form-section">
        <h2 id="form_title_notification">
            Ajouter une notification
        </h2>

        <form
            id="form_notification"
            method="post"
            action="route.php"
        >
            <input
                type="hidden"
                name="page"
                value="save_notification"
            >

            <input
                type="hidden"
                id="id_notification"
                name="id_notification"
                value=""
            >

            <div class="form-group">
                <label for="type_notification">
                    Type de notification *
                </label>

                <input
                    type="text"
                    id="type_notification"
                    name="type_notification"
                    maxlength="150"
                    placeholder="Exemple : Alerte de volatilité"
                    required
                >
            </div>

            <div class="form-actions">
                <button
                    type="button"
                    id="btn_ajouter_notification"
                    class="btn btn-add"
                    onclick="ajoutNotificationServeur()"
                >
                    Ajouter
                </button>

                <button
                    type="button"
                    id="btn_modifier_notification"
                    class="btn btn-edit hide"
                    onclick="majNotificationServeur()"
                >
                    Modifier
                </button>

                <button
                    type="button"
                    id="btn_annuler_notification"
                    class="btn btn-cancel hide"
                    onclick="clearFormNotification()"
                >
                    Annuler
                </button>

                <button
                    type="button"
                    class="btn btn-cancel"
                    onclick="window.location.href='gestion_crypto'"
                >
                    Retour au portfolio
                </button>
            </div>
        </form>
    </section>

    <section class="portfolio-section">
        <div class="section-header">
            <h2>Notifications existantes</h2>
        </div>

        <table id="table_notifications">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Type de notification</th>
                    <th>Modifier</th>
                    <th>Supprimer</th>
                </tr>
            </thead>

            <tbody></tbody>
        </table>
    </section>
</main>

<div
    class="modalChanged"
    id="divModalSaving"
></div>

<script src="js/gestion_notifications.js"></script>
