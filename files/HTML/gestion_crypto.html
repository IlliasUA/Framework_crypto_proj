<script language="JavaScript">
    $(function () {
        $("#form_crypto").on("submit", function () {
            const strategies = $('input[name="strategies[]"]:checked')
                .map(function () {
                    return this.value;
                })
                .get()
                .join(",");

            const notifications = $('input[name="notifications[]"]:checked')
                .map(function () {
                    return this.value;
                })
                .get()
                .join(",");

            $("#strategies").val(strategies);
            $("#notifications").val(notifications);

            // Les checkbox désactivées ne sont pas envoyées comme tableaux PHP.
            $('input[name="strategies[]"], input[name="notifications[]"]')
                .prop("disabled", true);
        });
    });
</script>
